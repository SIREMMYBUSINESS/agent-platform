[project]
name = "agent-platform"
version = "0.1.0"
description = "Receptionist + outreach agent platform foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0",
  "alembic>=1.13.1",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.1.18",
  "redis>=5.0.4",
  "celery>=5.3.6",
  "twilio>=9.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: requires POSTGRES_TEST_DATABASE_URL pointing to a dedicated *_test database",
]

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]
