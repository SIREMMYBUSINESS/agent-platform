[project]
name = "agent-platform"
version = "0.1.0"
description = "Receptionist + outreach agent platform foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.7.0",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.1.18",
  "redis>=5.0.4",
  "celery>=5.3.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
