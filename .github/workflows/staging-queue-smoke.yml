name: Staging queue smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/agent-workspace-dashboard

permissions:
  contents: read

jobs:
  queue-smoke:
    name: Enqueue and await provider-free staging task
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-staging-queue-smoke]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: staging
    env:
      ENVIRONMENT: staging
      DEPLOYMENT_REGION_ID: eu-west-1
      DATABASE_REGION_ID: eu-west-1
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_QUEUE_SMOKE_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify isolated Neon secret
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          database_url = os.environ.get("DATABASE_URL", "")
          hostname = urlsplit(database_url).hostname or ""
          if not hostname.lower().endswith(".neon.tech"):
              raise SystemExit(
                  "Missing or invalid STAGING_DATABASE_URL. Add it as a secret "
                  "to the GitHub Actions environment named staging, using the "
                  "isolated Neon connection string."
              )
          print("STAGING_DATABASE_URL is present and points to Neon.")
          PY
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Wake staging API and worker
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          origin = "https://agent-platform-staging.onrender.com"
          deadline = time.monotonic() + 180
          last_error = "service did not become ready"
          while time.monotonic() < deadline:
              try:
                  with urlopen(f"{origin}/ready", timeout=20) as response:
                      ready = json.load(response)
                  with urlopen(f"{origin}/health/components", timeout=20) as response:
                      components = json.load(response)
                  if ready.get("status") == "ready" and components.get("status") == "healthy":
                      print("STAGING_RUNTIME_READY api=ready components=healthy")
                      break
                  last_error = "API or worker component is not healthy yet"
              except Exception as exc:
                  last_error = type(exc).__name__
              time.sleep(10)
          else:
              raise SystemExit(f"Staging API/worker readiness failed: {last_error}")
          PY
      - name: Run provider-free queue smoke check
        run: python -m app.staging_queue_smoke
