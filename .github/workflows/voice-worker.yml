name: voice-worker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "voice-worker/**"
      - ".github/workflows/voice-worker.yml"
  push:
    branches: [main]
    paths:
      - "voice-worker/**"
      - ".github/workflows/voice-worker.yml"

permissions:
  contents: read

concurrency:
  group: voice-worker-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests and Wrangler dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: voice-worker
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Wrangler staging-config dry run (no deployment)
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir dist
