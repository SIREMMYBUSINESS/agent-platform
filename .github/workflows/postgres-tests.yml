name: PostgreSQL integration tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL 17 migration and rollback tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/agent_platform_test
      ENVIRONMENT: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt -e '.[test]'
      - name: Run opt-in PostgreSQL tests
        run: python -m pytest -v -m postgres -p no:cacheprovider
