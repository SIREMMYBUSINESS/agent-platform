name: Voice Worker CI

on:
  pull_request:
    paths:
      - "voice-worker/**"
      - ".github/workflows/voice-worker-ci.yml"
  push:
    branches:
      - feat/voice-worker
    paths:
      - "voice-worker/**"
      - ".github/workflows/voice-worker-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Wrangler dry-run
        run: npm run dry-run
