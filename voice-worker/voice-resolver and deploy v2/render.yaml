services:
  - type: web
    name: agent-platform-staging
    runtime: docker
    plan: free
    region: frankfurt
    branch: feat/agent-workspace-dashboard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh /app/ops/staging/start.sh
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEPLOYMENT_REGION_ID
        value: eu-west-1
      - key: DATABASE_REGION_ID
        value: eu-west-1
      - key: DATABASE_URL
        sync: false
      - key: PROVIDER_SECRETS_DIR
        value: /etc/secrets
      # SHA-256 hex digest of the voice gateway Worker's service key (never the key itself).
      - key: VOICE_GATEWAY_KEY_SHA256
        sync: false
      - key: WORKER_BOOTSTRAP_MODULE
        value: app.integrations.bootstrap_example
