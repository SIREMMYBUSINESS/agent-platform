services:
  - type: web
    name: agent-platform-staging
    runtime: docker
    plan: free
    region: frankfurt
    branch: feat/agent-workspace-dashboard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: >-
      sh -c 'python -m app.runtime_entry migrate || exit 1;
      (python -m app.runtime_entry worker) &
      exec python -m app.runtime_entry api'
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEPLOYMENT_REGION_ID
        value: eu-west-1
      - key: DATABASE_REGION_ID
        value: eu-west-1
      - key: DATABASE_URL
        sync: false
