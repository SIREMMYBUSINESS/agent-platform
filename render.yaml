services:
  - type: web
    name: agent-platform-staging
    runtime: docker
    plan: free
    region: frankfurt
    branch: feat/agent-workspace-dashboard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh /app/ops/staging/start.sh
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEPLOYMENT_REGION_ID
        value: eu-west-1
      - key: DATABASE_REGION_ID
        value: eu-west-1
      - key: PROVIDER_SECRETS_DIR
        value: /etc/secrets
      - key: DATABASE_URL
        sync: false
